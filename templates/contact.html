{% extends "base.html" %}
{% block title %}Contact - Check Your Resume{% endblock %}

{% block content %}
<section class="static-page">
  <div class="container narrow">

    <h1 class="page-heading">Contact</h1>

    <div class="box">
      <h2 class="box-heading">Found a bug or have an idea?</h2>
      <p>
        This is an open-source student project. The best way to reach me is to
        open an issue on GitHub. I read every one.
      </p>
      <p>
        <a class="btn btn-primary"
           href="https://github.com/codepiyusss/ATS-Check/issues"
           target="_blank" rel="noopener noreferrer">Open an issue on GitHub</a>
      </p>
    </div>

  </div>
</section>
{% endblock %}
