{% extends "base.html" %}
{% block title %}{{ title }} - Check Your Resume{% endblock %}

{% block content %}
<section class="static-page">
  <div class="container narrow">
    <div class="box" role="alert">
      <p class="ats-score-caption">Error {{ code }}</p>
      <h1 class="page-heading">{{ title }}</h1>
      <p>{{ message }}</p>
      <p><a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to home</a></p>
    </div>
  </div>
</section>
{% endblock %}
